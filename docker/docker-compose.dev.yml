version: "3.9"

services:
  app:
    image: snapdeck12/snapdeck-dev:latest
    container_name: snapdeck-dev-app
    env_file:
      - .env.dev
    restart: "unless-stopped"
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      # application.yml 적용 후 application-dev.yml 적용.
      SPRING_PROFILES_ACTIVE: dev
      # AWS_ACCESS_KEY: ${AWS_ACCESS_KEY}
      # AWS_SECRET_KEY: ${AWS_SECRET_KEY}
      TZ: Asia/Seoul
      # RDS 연결 정보
      DB_HOST: ${DB_HOST}
      DB_PORT: 3306
      DB_NAME: ${DB_NAME}
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
      # JDBC URL을 직접 주입하는 경우
      SPRING_DATASOURCE_URL: jdbc:mysql://${DB_HOST}:3306/${DB_NAME}?useSSL=true&serverTimezone=Asia/Seoul&characterEncoding=UTF-8
      SPRING_DATASOURCE_USERNAME: ${DB_USERNAME}
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD}
    # volumes:
      # SSL 인증서 파일 컨테이너 내부로 연결
      # - /etc/letsencrypt/live/[배포 도메인 url]/keystore.p12:/app/keystore.p12
